<section id="education" class="section">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">Education</h2>
      <p class="section-subtitle">Academic background</p>
    </div>
    <div class="education-grid">
      <div class="education-card" *ngFor="let edu of educations">
        <div class="education-icon">
          <i class="fas fa-graduation-cap"></i>
        </div>
        <div class="education-content">
          <h3 class="education-degree">{{ edu.degree }}</h3>
          <p class="education-institution">{{ edu.institution }}</p>
          <div class="education-details">
            <span class="education-years"
              >{{ edu.startYear }} - {{ edu.endYear }}</span
            >
            <span class="education-grade" *ngIf="edu.cgpa"
              >CGPA: {{ edu.cgpa }}</span
            >
            <span class="education-grade" *ngIf="edu.percentage"
              >{{ edu.percentage }}%</span
            >
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
